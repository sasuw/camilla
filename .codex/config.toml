[mcp_servers.dart-mcp]
command = "dart"
args = ["mcp-server","--force-roots-fallback"]

[mcp_servers.gitea]
command = "sh"
args = ["-c","exec env GITEA_PROJECT_DIR=\"$HOME\"'/Projects/github.com/sasuw/camilla' 'zsh' \"$HOME\"'/Projects/gitea.sasu.org/infra2/agent-docs/scripts/mcp/run_gitea_mcp.sh'"]
env_vars = ["GITEA_TOKEN_CODEX"]
env.GITEA_AGENT = "codex"
env.GITEA_HOST_SOURCE = "project"

